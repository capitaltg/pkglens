name: Pipeline
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  ECR_REPOSITORY: dependency-lens

jobs:
  frontend_ci_pipeline:
    name: Run tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      # - name: Install dependencies
      #   run: npm ci

      # - name: Check TypeScript types
      #   run: npm run lint

      # - name: Run npm audit
      #   run: npm audit --omit=dev --audit-level=high

      # build_and_publish:
      #   name: Build and publish docker image
      #   needs: frontend_ci_pipeline
      #   runs-on: ubuntu-latest
      #   if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      #   steps:
      #     - uses: actions/checkout@v6

      #     - name: Set up node.js
      #       uses: actions/setup-node@v6
      #       with:
      #         node-version: "22.x"
      #         cache: "npm"
      #         cache-dependency-path: "frontend/package-lock.json"

      #     - name: Install dependencies
      #       run: npm ci

      #     - name: Build npm app
      #       run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: image_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: docker build . -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      #   - name: Scan for vulnerabilities
      #     uses: aquasecurity/trivy-action@master
      #     env:
      #       ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      #     with:
      #       image-ref: "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
      #       format: "table"
      #       exit-code: "1"
      #       ignore-unfixed: true
      #       vuln-type: "os,library"
      #       severity: "CRITICAL"

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # - name: Update kubeconfig
      #   if: github.ref == 'refs/heads/main'
      #   run: aws eks update-kubeconfig --name ctg-prod-cluster-v2 --region us-east-1

      # - name: Restart deployment
      #   if: github.ref == 'refs/heads/main'
      #   run: kubectl rollout restart deployment/slatedata-dev-frontend
