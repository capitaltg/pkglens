services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deplens
      POSTGRES_USER: deplens
      POSTGRES_PASSWORD: deplens
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deplens']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: node dist-migrate/index.mjs
    environment:
      DATABASE_URL: postgresql://deplens:deplens@postgres:5432/deplens
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://deplens:deplens@postgres:5432/deplens
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: node dist-worker/index.mjs
    environment:
      DATABASE_URL: postgresql://deplens:deplens@postgres:5432/deplens
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
